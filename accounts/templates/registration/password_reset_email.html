{% autoescape off %}
<p>You requested a password reset for your account. Please click the link below to set a new password:</p>

<!-- 🎯 FORCE FRONTEND PATH: This explicitly directs the user to your React application's exact path structure -->
<p>
    <a href="http://{{ domain }}/password-reset-confirm/{{ uid }}/{{ token }}">
        Click here to reset your password
    </a>
</p>

<p>If you didn't request this change, you can safely ignore this email.</p>
{% endautoescape %}
